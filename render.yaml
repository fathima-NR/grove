services:
  - type: web
    name: grove-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --include=dev --prefix client && npm run build --prefix client && npm install --omit=dev --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CLIENT_ORIGIN
        value: https://grove-green.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
