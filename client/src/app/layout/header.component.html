<header class="header">
  <div class="container header-bar">
    <a class="logo" routerLink="/" (click)="close()">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M16 27c-6-4.2-10-8.6-10-13.2C6 9.4 9 6.5 12.6 6.5c2 0 3.4 1 3.4 1s1.4-1 3.4-1C22.9 6.5 26 9.4 26 13.8 26 18.4 22 22.8 16 27Z" fill="#1d3d2a"/>
          <path d="M16 11.5c1.8-3.2 4.6-5 7.2-5.2" stroke="#f6c445" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      Grove
    </a>

    <nav class="nav" [class.open]="menuOpen()">
      <a routerLink="/shop" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" (click)="close()">Shop</a>
      <a routerLink="/shop" [queryParams]="{ seasonal: 'true' }" (click)="close()">Seasonal</a>
      <a routerLink="/about" routerLinkActive="active" (click)="close()">Our grove</a>
      @if (auth.isLoggedIn()) {
        <a routerLink="/orders" routerLinkActive="active" (click)="close()">Orders</a>
        <button type="button" class="text-btn nav-logout" (click)="logout()">Sign out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" (click)="close()">Sign in</a>
      }
    </nav>

    <form class="search" (submit)="search($event)">
      <label class="sr-only" for="search">Search the market</label>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M16 16.5 20 20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input
        id="search"
        type="search"
        placeholder="Search oranges, berries, juice"
        [value]="query()"
        (input)="query.set($any($event.target).value)"
      />
    </form>

    <div class="header-tools">
      <a class="tool" routerLink="/cart" aria-label="Basket">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.5 8h11l-.8 11.2a1.5 1.5 0 0 1-1.5 1.3H8.8a1.5 1.5 0 0 1-1.5-1.3L6.5 8Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M9 8V6.8A3 3 0 0 1 12 3.8 3 3 0 0 1 15 6.8V8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        @if (cart.count() > 0) {
          <span class="count">{{ cart.count() }}</span>
        }
      </a>
      <button type="button" class="menu-btn" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()">
        Menu
      </button>
    </div>
  </div>
</header>
